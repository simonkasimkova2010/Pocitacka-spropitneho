<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spropitné a dělení účtu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF3F0;--surface:#FFFFFF;--ink:#14231F;--muted:#5B6E68;--line:#D3DED9;
  --accent:#0E6B5C;--on-accent:#FFFFFF;--chip:#E2ECE8;--hi:#F2B134;--on-hi:#2A1D00;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A17;--surface:#16262F1A;--surface:#17282A;--ink:#E7F1EC;--muted:#93A8A1;--line:#2A3F3A;
    --accent:#5CCDB5;--on-accent:#06221C;--chip:#1F3531;--hi:#F2B134;--on-hi:#2A1D00;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A17;--surface:#17282A;--ink:#E7F1EC;--muted:#93A8A1;--line:#2A3F3A;
  --accent:#5CCDB5;--on-accent:#06221C;--chip:#1F3531;--hi:#F2B134;--on-hi:#2A1D00;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5}
main{max-width:460px;margin:0 auto;padding:24px 18px 40px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.9rem;line-height:1.1;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
label,.lbl{display:block;font-weight:700;font-size:.95rem;margin-bottom:10px}
.money{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.money:focus-within{border-color:var(--accent)}
.money input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:800 2.4rem "Bricolage Grotesque",system-ui,sans-serif;outline:0;padding:0}
.money span{font-weight:700;color:var(--muted);font-size:1.2rem}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{border:0;border-radius:12px;background:var(--chip);color:var(--ink);font:700 1rem "DM Sans",sans-serif;padding:12px 0;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chip:focus-visible,.step:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.custom{display:flex;align-items:center;gap:6px}
.custom input{width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:center;padding:0;outline:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;gap:14px}
.step{width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font:700 1.5rem "DM Sans",sans-serif;cursor:pointer}
.n{font:800 1.8rem "Bricolage Grotesque",sans-serif;min-width:2ch;text-align:center}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:500;margin:0}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.toggle small{display:block;color:var(--muted);font-weight:400}
.result{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:22px 20px;margin-top:6px}
.result .big{font:800 3rem/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:6px 0 2px}
.result p{margin:0;opacity:.85}
.rows{margin-top:18px;border-top:1px dashed currentColor;padding-top:14px;display:grid;gap:8px}
.rows div{display:flex;justify-content:space-between;gap:12px}
.rows b{font-variant-numeric:tabular-nums}
.note{margin-top:12px;font-size:.9rem;background:var(--hi);color:var(--on-hi);border-radius:10px;padding:8px 12px;display:none}
</style>
</head>
<body>
<main>
  <h1>Spropitné a dělení účtu</h1>
  <p class="sub">Zadej účet, vyber spropitné a zjisti, kolik zaplatí každý.</p>

  <section class="card">
    <label for="bill">Částka na účtence</label>
    <div class="money"><input id="bill" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span>Kč</span></div>
  </section>

  <section class="card">
    <div class="lbl">Spropitné</div>
    <div class="chips" id="chips">
      <button class="chip" data-v="0" aria-pressed="false">0 %</button>
      <button class="chip" data-v="5" aria-pressed="false">5 %</button>
      <button class="chip" data-v="10" aria-pressed="true">10 %</button>
      <button class="chip" data-v="15" aria-pressed="false">15 %</button>
      <div class="chip custom" id="customWrap" aria-pressed="false"><input id="custom" type="text" inputmode="decimal" placeholder="Jiné" aria-label="Vlastní spropitné v procentech"></div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div class="lbl" style="margin:0" id="pl">Počet lidí</div>
      <div class="stepper">
        <button class="step" id="minus" aria-label="Ubrat osobu">−</button>
        <div class="n" id="people" aria-live="polite" aria-labelledby="pl">2</div>
        <button class="step" id="plus" aria-label="Přidat osobu">+</button>
      </div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <label class="toggle"><input type="checkbox" id="round"><span>Zaokrouhlit nahoru na 10 Kč<small>Každý zaplatí hezké kulaté číslo</small></span></label>
  </section>

  <section class="result" aria-live="polite">
    <p>Každý zaplatí</p>
    <div class="big" id="per">0 Kč</div>
    <p id="perNote">Zadej částku z účtenky.</p>
    <div class="rows">
      <div><span>Účet</span><b id="rBill">0 Kč</b></div>
      <div><span>Spropitné</span><b id="rTip">0 Kč</b></div>
      <div><span>Celkem</span><b id="rTotal">0 Kč</b></div>
    </div>
    <div class="note" id="note"></div>
  </section>
</main>
<script>
(function(){
  var bill=document.getElementById('bill'),custom=document.getElementById('custom'),
      chips=[].slice.call(document.querySelectorAll('.chip[data-v]')),cw=document.getElementById('customWrap'),
      peopleEl=document.getElementById('people'),roundEl=document.getElementById('round');
  var tip=10,people=2;
  var fmt=function(n){return new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:2}).format(Math.round(n*100)/100)+' Kč'};
  var num=function(s){var v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(v)&&v>0?v:0};
  function setEl(id,t){document.getElementById(id).textContent=t}
  function calc(){
    var b=num(bill.value),total=b*(1+tip/100),per=total/people,note=document.getElementById('note');
    if(roundEl.checked&&b>0){per=Math.ceil(per/10-1e-9)*10;total=per*people}
    var tipAmt=total-b;
    setEl('per',fmt(per));setEl('rBill',fmt(b));setEl('rTip',fmt(tipAmt));setEl('rTotal',fmt(total));
    setEl('perNote',b>0?'na osobu, '+people+' '+(people<5?'lidé':'lidí'):'Zadej částku z účtenky.');
    if(roundEl.checked&&b>0){
      var eff=tipAmt/b*100;
      note.style.display='block';note.textContent='Po zaokrouhlení vychází spropitné na '+eff.toFixed(1).replace('.',',')+' %.';
    }else note.style.display='none';
  }
  chips.forEach(function(c){c.addEventListener('click',function(){
    tip=+c.dataset.v;custom.value='';cw.setAttribute('aria-pressed','false');
    chips.forEach(function(x){x.setAttribute('aria-pressed',x===c)});calc();
  })});
  custom.addEventListener('input',function(){
    var v=num(custom.value);tip=v;cw.setAttribute('aria-pressed',custom.value?'true':'false');
    chips.forEach(function(x){x.setAttribute('aria-pressed','false')});calc();
  });
  document.getElementById('minus').onclick=function(){if(people>1){people--;peopleEl.textContent=people;calc()}};
  document.getElementById('plus').onclick=function(){if(people<50){people++;peopleEl.textContent=people;calc()}};
  bill.addEventListener('input',calc);roundEl.addEventListener('change',calc);
  calc();
})();
</script>
</body>
</html>
